    <script>
  document.querySelectorAll('[data-event]').forEach(function (link) {
    link.addEventListener('click', function () {
      const eventName = link.dataset.event;

      if (typeof gtag === 'function') {

  link_url: link.href,
  link_text: link.textContent.trim()
});
